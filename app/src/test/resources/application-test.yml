spring:
  flyway.enabled: true
  jpa.hibernate.ddl-auto: validate
  security.oauth2.resourceserver.jwt.issuer-uri: http://localhost:8081/realms/verdant
  ai:
    model:
      embedding: transformers
    embedding:
      transformer:
        onnx:
          model-uri: https://huggingface.co/sentence-transformers/all-mpnet-base-v2/resolve/main/onnx/model.onnx
        tokenizer:
          uri: https://huggingface.co/sentence-transformers/all-mpnet-base-v2/resolve/main/tokenizer.json

aws:
  s3:
    endpoint: http://localhost:4566
    bucket: verdant-images
    region: ap-south-1
    access-key: test
    secret-key: test

# Not a real Razorpay secret - signature verification is pure HMAC math, no
# network call, so tests compute a signature with this same value and check
# our code accepts/rejects correctly. Never used to talk to Razorpay itself.
razorpay:
  key-id: rzp_test_dummy
  key-secret: test-secret-for-signature-verification-only
  webhook-secret: test-webhook-secret-for-signature-verification-only

# StubCourierGateway (@Profile("test")) is what's actually wired in tests -
# ShiprocketGateway is never constructed under the test profile, so these
# never talk to a real API. webhook-api-key is a real comparison value
# though (ShiprocketWebhookVerifier is plain, profile-independent), same
# reasoning as the Razorpay secret above.
shiprocket:
  email: test@example.com
  password: test-password-never-used
  webhook-api-key: test-webhook-api-key-for-verification-only


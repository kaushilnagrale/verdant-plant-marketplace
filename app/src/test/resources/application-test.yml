spring:
  flyway.enabled: true
  jpa.hibernate.ddl-auto: validate
  security.oauth2.resourceserver.jwt.issuer-uri: http://localhost:8081/realms/verdant
  ai:
    model:
      embedding: transformers
    embedding:
      transformer:
        onnx:
          model-uri: https://huggingface.co/sentence-transformers/all-mpnet-base-v2/resolve/main/onnx/model.onnx
        tokenizer:
          uri: https://huggingface.co/sentence-transformers/all-mpnet-base-v2/resolve/main/tokenizer.json

# OTLP export is non-blocking/best-effort by design (a failed send logs
# a warning, never fails the traced request) - sampling is still turned
# off here anyway, purely so 285+ tests don't all spend even a small
# amount of background effort trying to reach a Jaeger container that
# doesn't exist in this profile.
management:
  tracing:
    sampling.probability: 0.0

aws:
  s3:
    endpoint: http://localhost:4566
    bucket: verdant-images
    region: ap-south-1
    access-key: test
    secret-key: test

# Not a real Razorpay secret - signature verification is pure HMAC math, no
# network call, so tests compute a signature with this same value and check
# our code accepts/rejects correctly. Never used to talk to Razorpay itself.
razorpay:
  key-id: rzp_test_dummy
  key-secret: test-secret-for-signature-verification-only
  webhook-secret: test-webhook-secret-for-signature-verification-only

# StubCourierGateway (@Profile("test")) is what's actually wired in tests -
# ShiprocketGateway is never constructed under the test profile, so these
# never talk to a real API. webhook-api-key is a real comparison value
# though (ShiprocketWebhookVerifier is plain, profile-independent), same
# reasoning as the Razorpay secret above.
shiprocket:
  email: test@example.com
  password: test-password-never-used
  webhook-api-key: test-webhook-api-key-for-verification-only

# DispatchOrchestrationJob uses fixedDelay (not a cron expression like
# ForecastRefreshJob/HoldReleaseJob), which fires shortly after context
# startup by default - that would mean it starts mutating shipment rows
# mid-test in every single test that boots the full Spring context,
# racing against whatever that test is asserting. Effectively disabled
# for automated tests; still directly callable via orchestrate() when a
# test wants to invoke it explicitly (see DispatchOrchestrationJobTest).
verdant:
  dispatch:
    orchestration-initial-delay-ms: 999999999
    orchestration-interval-ms: 999999999
  # ListingProjector's @KafkaListener (Week 9) is the first real Kafka
  # consumer this project has - unlike EventPublisher/StubEventPublisher
  # on the producer side, there is no test-profile stand-in for a
  # @KafkaListener's listener container, which actively tries to connect
  # to a real broker regardless. Only IntegrationTestBase's Postgres+Redis
  # run for the other ~190 tests in this project; none of them have a
  # real Kafka broker, so autoStartup defaults off here and
  # SearchIntegrationTestBase turns it back on for the tests that do.
  search:
    projector:
      autostart: false
  # NotificationSender.sendQueued() (Week 10) is a fixedDelay job like
  # DispatchOrchestrationJob above, same real reason to suppress it here:
  # a real background tick could race a test's own explicit
  # sender.sendQueued() call, or process an EARLIER test's leftover
  # queued message using whatever whatsapp_templates.approved currently
  # holds (a real, shared, mutable row) - found for real, not
  # hypothetically, by NotificationTest's own sendCount() assertions
  # flaking. Still directly callable via sendQueued() when a test wants
  # to invoke it explicitly (every NotificationTest scenario does).
  notifications:
    interval-ms: 999999999
  # BusinessMetrics.refresh() (Week 12) is the same fixedDelay shape as
  # every job above - a real background tick mid-test would poll
  # whatever count another test's own fixtures happen to have left
  # behind at that exact moment and update a shared MeterRegistry with
  # it, racing BusinessMetricsTest's own direct refresh() call.
  # Suppressed here, still directly callable.
  metrics:
    interval-ms: 999999999


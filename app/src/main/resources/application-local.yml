spring:
  config:
    import: "optional:classpath:application-local-secrets.yml"
  datasource:
    url: jdbc:postgresql://localhost:5433/verdant
    username: verdant
    password: verdant
  data.redis:
    host: localhost
    port: 6379
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: search-projector
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  security.oauth2.resourceserver.jwt:
    issuer-uri: http://localhost:8081/realms/verdant
  ai:
    model:
      embedding: transformers
    embedding:
      transformer:
        onnx:
          model-uri: https://huggingface.co/sentence-transformers/all-mpnet-base-v2/resolve/main/onnx/model.onnx
        tokenizer:
          uri: https://huggingface.co/sentence-transformers/all-mpnet-base-v2/resolve/main/tokenizer.json

logging.level:
  com.verdant: DEBUG
  org.hibernate.SQL: DEBUG

aws:
  s3:
    endpoint: http://localhost:4566
    bucket: verdant-images
    region: ap-south-1
    access-key: test
    secret-key: test

verdant:
  mapping:
    auto-threshold: 0.030
    review-threshold: 0.012
  search:
    opensearch-uri: http://localhost:9200

# Matches the "verdant-backend" service-account client scripts/setup-keycloak.sh
# creates locally - a dev-only secret, the same real treatment as verdant-seller's
# own "dev-secret" already in this file's own spirit (not the gitignored
# application-local-secrets.yml, since this is a fake-but-functional local
# credential this project's own setup script creates, not a real one).
keycloak:
  admin:
    base-url: http://localhost:8081
    realm: verdant
    client-id: verdant-backend
    client-secret: buyer-backend-dev-secret

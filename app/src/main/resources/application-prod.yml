spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  data.redis:
    host: ${REDIS_HOST}
    port: ${REDIS_PORT}
  security.oauth2.resourceserver.jwt:
    issuer-uri: ${OIDC_ISSUER_URI}
  ai:
    model:
      embedding: transformers
    embedding:
      transformer:
        onnx:
          model-uri: ${EMBEDDING_MODEL_URI}
        tokenizer:
          uri: ${EMBEDDING_TOKENIZER_URI}

aws:
  s3:
    bucket: ${S3_BUCKET}
    region: ${AWS_REGION}

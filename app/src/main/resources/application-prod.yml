spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  data.redis:
    host: ${REDIS_HOST}
    port: ${REDIS_PORT}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  security.oauth2.resourceserver.jwt:
    issuer-uri: ${OIDC_ISSUER_URI}
  ai:
    model:
      embedding: transformers
    embedding:
      transformer:
        onnx:
          model-uri: ${EMBEDDING_MODEL_URI}
        tokenizer:
          uri: ${EMBEDDING_TOKENIZER_URI}

aws:
  s3:
    bucket: ${S3_BUCKET}
    region: ${AWS_REGION}

# Gap fixed 2026-09 (Week 6, Day 31 audit): this was missing entirely since
# Day 23 - RazorpayProperties would have silently bound to null in prod.
razorpay:
  key-id: ${RAZORPAY_KEY_ID}
  key-secret: ${RAZORPAY_KEY_SECRET}
  webhook-secret: ${RAZORPAY_WEBHOOK_SECRET}

shiprocket:
  email: ${SHIPROCKET_EMAIL}
  password: ${SHIPROCKET_PASSWORD}
  webhook-api-key: ${SHIPROCKET_WEBHOOK_API_KEY}

verdant:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  # Gap found and fixed while running Week 7's dockerize.sh smoke test
  # (2026-09) - same shape as the Day 31 Razorpay gap: WeatherProperties
  # would have silently bound to null in prod, and ForecastRefreshJob
  # would have failed every single run against a real deployment.
  weather:
    api-key: ${WEATHER_API_KEY}

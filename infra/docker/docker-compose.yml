services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: verdant-postgres
    environment:
      POSTGRES_USER: verdant
      POSTGRES_PASSWORD: verdant
      POSTGRES_DB: verdant
    ports: ["5433:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verdant"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: verdant-redis
    ports: ["6379:6379"]

  redpanda:
    image: redpandadata/redpanda:latest
    container_name: verdant-redpanda
    command:
      - redpanda start
      - --smp 1
      - --overprovisioned
      - --node-id 0
      - --kafka-addr PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://localhost:9092
    ports: ["9092:9092"]

  localstack:
    image: localstack/localstack:4.4.0
    container_name: verdant-localstack
    environment:
      SERVICES: s3
    ports: ["4566:4566"]

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: verdant-keycloak
    command: start-dev --http-port=8081
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports: ["8081:8081"]

  opensearch:
    image: opensearchproject/opensearch:2.18.0
    container_name: verdant-opensearch
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms1g -Xmx1g"
      bootstrap.memory_lock: "true"
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile:  { soft: 65536, hard: 65536 }
    ports: ["9200:9200"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      retries: 12

volumes:
  pgdata:

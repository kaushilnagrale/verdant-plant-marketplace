services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: verdant-postgres
    environment:
      POSTGRES_USER: verdant
      POSTGRES_PASSWORD: verdant
      POSTGRES_DB: verdant
    ports: ["5433:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verdant"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: verdant-redis
    ports: ["6379:6379"]

  redpanda:
    image: redpandadata/redpanda:latest
    container_name: verdant-redpanda
    command:
      - redpanda start
      - --smp 1
      - --overprovisioned
      - --node-id 0
      - --kafka-addr PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://localhost:9092
    ports: ["9092:9092"]

  localstack:
    image: localstack/localstack:4.4.0
    container_name: verdant-localstack
    environment:
      SERVICES: s3
    ports: ["4566:4566"]

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: verdant-keycloak
    command: start-dev --http-port=8081
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports: ["8081:8081"]

volumes:
  pgdata:
